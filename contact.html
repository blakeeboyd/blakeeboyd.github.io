<body>
    <div class="container">
        <site-nav></site-nav>

        <main id="main-content">
            <section class="hero">
                <h1>Contact</h1>
                <p class="subtitle">Get in touch with me.</p>
            </section>

            <section class="contact-form-section">
                <div id="form-status" class="form-status" aria-live="polite"></div>
                <form class="contact-form" id="contact-form">
                    <!-- Honeypot field - hidden from users, catches bots -->
                    <div class="form-group" style="position: absolute; left: -9999px;" aria-hidden="true">
                        <label class="form-label" for="contact-website">Website</label>
                        <input type="text" id="contact-website" name="website" class="form-input" tabindex="-1" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="entry.2017708535" class="form-input" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="entry.1367594786" class="form-input" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-subject">Subject</label>
                        <input type="text" id="contact-subject" name="entry.515603998" class="form-input" required placeholder="What's this about?">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-message">Message</label>
                        <textarea id="contact-message" name="entry.1948691851" class="form-input form-textarea" required placeholder="Your message..." rows="6"></textarea>
                    </div>
                    <button type="submit" class="form-submit">Send Message</button>
                </form>
                <div class="form-success hidden" id="form-success">
                    <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <h2>Message Sent</h2>
                    <p>Thank you for reaching out. I'll get back to you soon.</p>
                </div>
            </section>
        </main>

    <script src="js/contact-form.js" defer></script>

        <footer>
            <p>&copy; <span class="footer-year"></span> Blake Boyd</p>
        </footer>
    </div>
</body>
</html>
