<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Blake Boyd">
    <title>Contact - Blake Boyd</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="index.html" class="logo">Blake Boyd</a>
                <div class="nav-links">
                    <a href="about.html" class="nav-link">About</a>
                    <a href="projects.html" class="nav-link">Projects</a>
                    <a href="contact.html" class="nav-link active">Contact</a>
                    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </nav>
        </header>

        <main>
            <section class="hero">
                <h1>Contact</h1>
                <p class="subtitle">Get in touch with me.</p>
            </section>

            <section class="contact-form-section">
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <label class="form-label" for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="entry.2017708535" class="form-input" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="entry.1367594786" class="form-input" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-subject">Subject</label>
                        <input type="text" id="contact-subject" name="entry.515603998" class="form-input" required placeholder="What's this about?">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contact-message">Message</label>
                        <textarea id="contact-message" name="entry.1948691851" class="form-input form-textarea" required placeholder="Your message..." rows="6"></textarea>
                    </div>
                    <button type="submit" class="form-submit">Send Message</button>
                </form>
                <div class="form-success hidden" id="form-success">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <h2>Message Sent</h2>
                    <p>Thank you for reaching out. I'll get back to you soon.</p>
                </div>
            </section>

            <script>
                document.getElementById('contact-form').addEventListener('submit', function(e) {
                    e.preventDefault();

                    const form = this;
                    const formData = new FormData(form);
                    const submitButton = form.querySelector('.form-submit');

                    submitButton.disabled = true;
                    submitButton.textContent = 'Sending...';

                    fetch('https://docs.google.com/forms/d/e/1FAIpQLSftQC3-QlgIvA3_dVFKJoeNN-k6B6CdDjzE6X74oGA-Uhg5Ww/formResponse', {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors'
                    }).then(function() {
                        form.classList.add('hidden');
                        document.getElementById('form-success').classList.remove('hidden');
                    }).catch(function() {
                        form.classList.add('hidden');
                        document.getElementById('form-success').classList.remove('hidden');
                    });
                });
            </script>
        </main>

        <footer>
            <p>&copy; 2025 Blake Boyd</p>
        </footer>
    </div>
</body>
</html>
