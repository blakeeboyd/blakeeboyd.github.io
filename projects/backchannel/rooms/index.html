<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Backchannel rooms page (admin only)

  Lists every room in the backchannel/_rooms registry and the default room.
  Admin can switch into a room, create new ones, and delete custom rooms.
  Admin status is read from sessionStorage["backchannel.admin"], which the
  room page writes on a successful unlock-gesture + Blake join. Non-admins
  are bounced to the room with a notice.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backchannel rooms</title>

<!-- PWA metadata (shared with the room and archives pages). Manifest and icons
     live one directory up; the scope set in manifest.json covers this page. -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Backchannel">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

:root {
  --color-bg:#f8f9fa; --color-text:#1a1a1a; --color-text-muted:#5b6370;
  --color-accent:#2563eb; --color-accent-light:#dbeafe; --color-accent-medium:#3b82f6;
  --color-accent-hover:#1d4ed8; --color-border:#e5e7eb; --color-card-bg:#ffffff;
  --color-control-bg:#f3f4f6;
  --color-success:#10b981; --color-warning:#f59e0b; --color-error:#ef4444;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-serif:'Source Serif 4','Source Serif Pro',Charter,Georgia,serif;
  --font-mono:'JetBrains Mono','SF Mono',Monaco,Consolas,monospace;
  --feat-sans:"cv11","ss01","cv05"; --feat-mono:"tnum","zero";
  --text-xs:0.75rem; --text-sm:0.875rem; --text-base:1rem; --text-md:1.125rem;
  --text-lg:1.4rem; --text-xl:1.75rem;
  --lh-tight:1.1; --lh-snug:1.25; --lh-body:1.55;
  --tracking-tight:-0.015em; --tracking-wide:0.05em;
  --spacing-xs:0.5rem; --spacing-sm:1rem; --spacing-md:1.5rem; --spacing-lg:2rem;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
  --radius-sm:0.375rem; --radius-md:0.5rem; --radius-lg:0.75rem;
  --transition-fast:0.15s ease; --transition-normal:0.2s ease;
}
[data-theme="dark"] {
  --color-bg:#111827; --color-text:#f3f4f6; --color-text-muted:#9ca3af;
  --color-accent:#bfdbfe; --color-accent-light:rgba(191,219,254,0.15);
  --color-border:#374151; --color-card-bg:#1f2937; --color-control-bg:#374151;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
}
html { font-size:18px; -webkit-font-smoothing:antialiased; }
body {
  margin:0; font-family:var(--font-sans); font-feature-settings:var(--feat-sans);
  background:var(--color-bg); color:var(--color-text); line-height:var(--lh-body);
}
*, *::before, *::after { box-sizing:border-box; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
a { color:var(--color-accent); text-decoration:underline; text-underline-offset:2px; }
a:hover { opacity:0.8; }
input { font:inherit; color:inherit; }

.app {
  max-width:900px; margin:0 auto;
  padding:var(--spacing-md) var(--spacing-sm);
  display:flex; flex-direction:column; gap:var(--spacing-md);
  min-height:100vh; min-height:100dvh;
}

.header {
  display:flex; align-items:center; gap:var(--spacing-sm);
}
.header__brand {
  display:flex; align-items:center; gap:0.75rem; flex:1; min-width:0;
}
.header__title-block { min-width:0; }
.header__title {
  font-family:var(--font-serif); font-variation-settings:"opsz" 28;
  font-size:var(--text-xl); font-weight:600; line-height:var(--lh-tight);
  letter-spacing:var(--tracking-tight); margin:0;
}
.header__controls { display:flex; align-items:center; gap:var(--spacing-sm); }
.header__back {
  font-size:var(--text-sm); color:var(--color-text-muted);
  text-decoration:none; padding:0.375rem 0.625rem;
  border:1px solid var(--color-border); border-radius:var(--radius-md);
  background:var(--color-card-bg);
  transition:border-color var(--transition-fast), background var(--transition-fast);
}
.header__back:hover {
  border-color:var(--color-text); background:var(--color-control-bg); opacity:1;
}

.theme-toggle {
  width:36px; height:36px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--color-border); border-radius:var(--radius-md);
  color:var(--color-text); background:var(--color-card-bg);
  transition:background var(--transition-fast), color var(--transition-fast),
             border-color var(--transition-fast);
}
.theme-toggle:hover {
  background:var(--color-text); color:var(--color-card-bg); border-color:var(--color-text);
}

.notice {
  display:none;
  padding:var(--spacing-xs) var(--spacing-sm);
  background:var(--color-card-bg);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  font-size:var(--text-sm);
}
.notice.is-visible { display:block; }
.notice__dot {
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--color-warning); margin-right:0.5rem; vertical-align:middle;
}

.card {
  background:var(--color-card-bg);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  padding:var(--spacing-md);
  display:flex; flex-direction:column; gap:var(--spacing-sm);
}
.card__title {
  margin:0;
  font-family:var(--font-serif); font-variation-settings:"opsz" 24;
  font-size:var(--text-lg); font-weight:600; letter-spacing:var(--tracking-tight);
}
.card__lead {
  margin:0; font-size:var(--text-sm); color:var(--color-text-muted);
}

.rooms-list {
  list-style:none; padding:0; margin:0;
  display:flex; flex-direction:column; gap:0.5rem;
}
.room-row {
  display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-sm);
  padding:0.75rem 0.875rem;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  background:var(--color-bg);
}
.room-row--current {
  border-color:var(--color-accent);
  background:var(--color-accent-light);
}
.room-row__info {
  display:flex; flex-direction:column; gap:0.125rem; min-width:0;
}
.room-row__key {
  font-family:var(--font-mono); font-feature-settings:var(--feat-mono);
  font-size:var(--text-base); font-weight:500;
}
.room-row__meta {
  font-size:var(--text-xs); color:var(--color-text-muted);
}
.room-row__actions {
  display:flex; gap:0.375rem; flex-wrap:wrap; justify-content:flex-end;
}
.action-btn {
  font-size:var(--text-xs); font-family:var(--font-mono);
  font-feature-settings:var(--feat-mono); font-weight:500;
  text-transform:uppercase; letter-spacing:var(--tracking-wide);
  padding:0.25rem 0.625rem;
  border:1px solid var(--color-border); border-radius:var(--radius-sm);
  background:transparent; color:var(--color-accent);
  transition:border-color var(--transition-fast), background var(--transition-fast);
}
.action-btn:hover {
  border-color:var(--color-accent); background:var(--color-card-bg);
}
.action-btn--danger { color:var(--color-error); }
.action-btn--danger:hover { border-color:var(--color-error); }
.action-btn[disabled] {
  color:var(--color-text-muted); cursor:not-allowed; opacity:0.5;
}

.create-form {
  display:flex; gap:0.5rem; align-items:stretch;
}
.create-form__input {
  flex:1; padding:0.625rem 0.875rem;
  border:1px solid var(--color-border); border-radius:var(--radius-md);
  background:var(--color-card-bg); color:var(--color-text);
  font-family:var(--font-mono); font-feature-settings:var(--feat-mono);
}
.create-form__input:focus {
  outline:none; border-color:var(--color-accent);
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}
.create-form__btn {
  padding:0.625rem 1.125rem;
  font-weight:500; color:#fff;
  background:var(--color-accent);
  border-radius:var(--radius-md);
  transition:background var(--transition-fast);
}
.create-form__btn:hover { background:var(--color-accent-hover); }
.create-form__btn:disabled { background:var(--color-text-muted); cursor:not-allowed; }
.create-hint {
  font-size:var(--text-sm); color:var(--color-text-muted);
  min-height:1.25rem; margin:0;
}
.create-hint.is-error { color:var(--color-error); }

/* Admin-gate screen */
.gate {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  flex:1; min-height:50vh; text-align:center; gap:var(--spacing-sm);
}
.gate__title {
  font-family:var(--font-serif); font-variation-settings:"opsz" 28;
  font-size:var(--text-xl); margin:0;
}
.gate__hint { color:var(--color-text-muted); margin:0; }

@media (max-width: 480px) {
  .room-row { flex-direction:column; align-items:stretch; }
  .room-row__actions { justify-content:flex-start; }
}
</style>
</head>
<body>

<div class="app">

  <header class="header">
    <div class="header__brand">
      <span aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
          <rect width="32" height="32" rx="6" fill="#2563eb"></rect>
          <path d="M4,16 Q8,8 12,16 T20,16 T28,16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>
          <path d="M4,16 Q10,22 16,16 T28,16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"></path>
        </svg>
      </span>
      <div class="header__title-block">
        <h1 class="header__title">Backchannel rooms</h1>
      </div>
    </div>
    <div class="header__controls">
      <a class="header__back" id="back-link" href="../">Back to room</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
        <!-- icon injected by JS -->
      </button>
    </div>
  </header>

  <div class="notice" id="notice" role="status">
    <span class="notice__dot" aria-hidden="true"></span>
    <span id="notice-text"></span>
  </div>

  <main id="main"></main>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAoN6kYjrq4b3aatmnd8pgxgg5wV-ekScE",
  authDomain: "soundbox-9.firebaseapp.com",
  databaseURL: "https://soundbox-9-default-rtdb.firebaseio.com",
  projectId: "soundbox-9",
  appId: "1:1069332070599:web:4959225a4eb3d33e6ebee2"
};
const ROOMS_REGISTRY_PATH = "backchannel/_rooms";
const DEFAULT_ROOM = "default";
const ROOM_KEY_RE  = /^[a-z0-9-]{1,40}$/;

const STORAGE_THEME = "backchannel.theme";
const SESSION_ADMIN = "backchannel.admin";

/* ============================================================
   DOM
   ============================================================ */
const $ = (id) => document.getElementById(id);
const root       = document.documentElement;
const themeBtn   = $("theme-toggle");
const noticeEl   = $("notice");
const noticeText = $("notice-text");
const backLink   = $("back-link");
const mainEl     = $("main");

/* ============================================================
   Room param (only used to preserve context on back link)
   ============================================================ */
function deriveRoomKey() {
  let raw = "";
  try {
    const params = new URLSearchParams(window.location.search);
    raw = (params.get("room") || "").trim().toLowerCase();
  } catch (e) {}
  if (!raw || !ROOM_KEY_RE.test(raw)) return DEFAULT_ROOM;
  return raw;
}
const CONTEXT_ROOM = deriveRoomKey();
if (CONTEXT_ROOM !== DEFAULT_ROOM) {
  backLink.href = "../?room=" + encodeURIComponent(CONTEXT_ROOM);
}

/* ============================================================
   Theme
   ============================================================ */
const SUN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
const MOON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(theme) {
  root.setAttribute("data-theme", theme);
  themeBtn.innerHTML = theme === "dark" ? SUN_SVG : MOON_SVG;
  themeBtn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
}
function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem(STORAGE_THEME); } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(theme);
}
themeBtn.addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(STORAGE_THEME, next); } catch (e) {}
});
initTheme();

/* ============================================================
   Admin gate
   ============================================================ */
function readAdminToken() {
  try {
    const raw = sessionStorage.getItem(SESSION_ADMIN);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed.token === "string" ? parsed.token : null;
  } catch (e) { return null; }
}

function renderGate() {
  mainEl.innerHTML = "";
  const gate = document.createElement("div");
  gate.className = "gate";
  const title = document.createElement("h2");
  title.className = "gate__title";
  title.textContent = "Admin sign-in required";
  const hint = document.createElement("p");
  hint.className = "gate__hint";
  hint.textContent = "Open the room and sign in as admin from the join screen, then come back to this page.";
  const link = document.createElement("a");
  link.href = backLink.href;
  link.textContent = "Back to room";
  gate.appendChild(title);
  gate.appendChild(hint);
  gate.appendChild(link);
  mainEl.appendChild(gate);
}

function showNotice(text) {
  noticeText.textContent = text;
  noticeEl.classList.add("is-visible");
}

/* ============================================================
   Backend
   ============================================================ */
let dbMod = null;
let db    = null;
let regRef = null;
let roomsData = [];

async function initBackend() {
  try {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    dbMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = appMod.initializeApp(firebaseConfig);
    db = dbMod.getDatabase(app);
    regRef = dbMod.ref(db, ROOMS_REGISTRY_PATH);

    dbMod.onValue(regRef, (snap) => {
      const v = snap.val() || {};
      const rows = [];
      for (const key of Object.keys(v)) {
        const entry = v[key] || {};
        rows.push({
          key,
          ts: typeof entry.ts === "number" ? entry.ts : 0,
          createdBy: entry.createdBy || "unknown",
          label: typeof entry.label === "string" ? entry.label : ""
        });
      }
      rows.sort((a, b) => b.ts - a.ts);
      roomsData = rows;
      renderRooms();
    });
  } catch (err) {
    console.error("Firebase init failed:", err);
    showNotice("Could not reach the rooms database.");
  }
}

async function createRoom(key, createdBy) {
  await dbMod.set(dbMod.ref(db, ROOMS_REGISTRY_PATH + "/" + key), {
    ts: dbMod.serverTimestamp(),
    createdBy: createdBy || "unknown",
    label: ""
  });
}

async function deleteRoom(key) {
  await dbMod.set(dbMod.ref(db, ROOMS_REGISTRY_PATH + "/" + key), null);
}

/* ============================================================
   Render
   ============================================================ */
function formatDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString();
}

function buildShell() {
  mainEl.innerHTML = "";

  // List card
  const listCard = document.createElement("section");
  listCard.className = "card";
  listCard.id = "list-card";
  const listTitle = document.createElement("h2");
  listTitle.className = "card__title";
  listTitle.textContent = "Rooms";
  const listLead = document.createElement("p");
  listLead.className = "card__lead";
  listLead.textContent = "The default room exists automatically. Custom rooms must be created here before non-admins can land on them.";
  const listUl = document.createElement("ul");
  listUl.className = "rooms-list";
  listUl.id = "rooms-list";
  listCard.appendChild(listTitle);
  listCard.appendChild(listLead);
  listCard.appendChild(listUl);
  mainEl.appendChild(listCard);

  // Create card
  const createCard = document.createElement("section");
  createCard.className = "card";
  const createTitle = document.createElement("h2");
  createTitle.className = "card__title";
  createTitle.textContent = "Create a room";
  const createLead = document.createElement("p");
  createLead.className = "card__lead";
  createLead.textContent = "Lowercase letters, digits, and hyphens. Max 40 characters. Example: mus399-fall26.";
  const form = document.createElement("form");
  form.className = "create-form";
  form.id = "create-form";
  form.noValidate = true;
  const input = document.createElement("input");
  input.className = "create-form__input";
  input.id = "create-input";
  input.type = "text";
  input.autocomplete = "off";
  input.maxLength = 40;
  input.placeholder = "new-room-key";
  const btn = document.createElement("button");
  btn.className = "create-form__btn";
  btn.type = "submit";
  btn.textContent = "Create room";
  form.appendChild(input);
  form.appendChild(btn);
  const hint = document.createElement("p");
  hint.className = "create-hint";
  hint.id = "create-hint";
  createCard.appendChild(createTitle);
  createCard.appendChild(createLead);
  createCard.appendChild(form);
  createCard.appendChild(hint);
  mainEl.appendChild(createCard);

  form.addEventListener("submit", onCreateSubmit);
}

function renderRooms() {
  const listUl = $("rooms-list");
  if (!listUl) return;
  listUl.innerHTML = "";

  const all = [{ key: DEFAULT_ROOM, ts: 0, createdBy: "implicit", label: "Default room", synthetic: true }].concat(roomsData);
  for (const row of all) {
    const li = document.createElement("li");
    li.className = "room-row" + (row.key === CONTEXT_ROOM ? " room-row--current" : "");

    const info = document.createElement("div");
    info.className = "room-row__info";
    const key = document.createElement("div");
    key.className = "room-row__key";
    key.textContent = row.key;
    info.appendChild(key);
    const meta = document.createElement("div");
    meta.className = "room-row__meta";
    if (row.synthetic) {
      meta.textContent = "Always available, cannot be deleted.";
    } else {
      meta.textContent = "Created " + formatDate(row.ts) + " by " + row.createdBy;
    }
    info.appendChild(meta);
    li.appendChild(info);

    const actions = document.createElement("div");
    actions.className = "room-row__actions";

    const openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "action-btn";
    openBtn.textContent = "open";
    openBtn.setAttribute("aria-label", "Open room " + row.key);
    openBtn.addEventListener("click", () => openRoom(row.key));
    actions.appendChild(openBtn);

    if (!row.synthetic) {
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "action-btn action-btn--danger";
      delBtn.textContent = "delete";
      delBtn.setAttribute("aria-label", "Delete room " + row.key);
      delBtn.addEventListener("click", () => deleteWithConfirm(row.key));
      actions.appendChild(delBtn);
    }

    li.appendChild(actions);
    listUl.appendChild(li);
  }
}

function openRoom(key) {
  const url = key === DEFAULT_ROOM
    ? "../"
    : "../?room=" + encodeURIComponent(key);
  window.location.href = url;
}

async function onCreateSubmit(e) {
  e.preventDefault();
  const input = $("create-input");
  const hint = $("create-hint");
  hint.classList.remove("is-error");
  hint.textContent = "";

  const raw = (input.value || "").trim().toLowerCase();
  if (!raw) return;
  if (!ROOM_KEY_RE.test(raw)) {
    hint.classList.add("is-error");
    hint.textContent = "Room key must be lowercase letters, digits, or hyphens (1-40 chars).";
    return;
  }
  if (raw === DEFAULT_ROOM) {
    hint.classList.add("is-error");
    hint.textContent = "The default room exists automatically.";
    return;
  }
  if (roomsData.some((r) => r.key === raw)) {
    hint.classList.add("is-error");
    hint.textContent = "A room with that key already exists.";
    return;
  }
  try {
    const stored = sessionStorage.getItem(SESSION_ADMIN);
    let by = "admin";
    if (stored) {
      try { const p = JSON.parse(stored); if (p && p.token) by = "Blake"; } catch (e2) {}
    }
    await createRoom(raw, by);
    hint.textContent = "Created. Opening…";
    input.value = "";
    setTimeout(() => openRoom(raw), 250);
  } catch (err) {
    console.error("Create room failed:", err);
    hint.classList.add("is-error");
    hint.textContent = "Could not create the room.";
  }
}

async function deleteWithConfirm(key) {
  const ok = window.confirm(
    "Delete the room \"" + key + "\"? " +
    "The registry entry is removed and non-admins can no longer land on this URL. " +
    "Any existing messages in this room remain in Firebase but become inaccessible from the app."
  );
  if (!ok) return;
  try {
    await deleteRoom(key);
  } catch (err) {
    console.error("Delete room failed:", err);
    window.alert("Could not delete the room.");
  }
}

/* ============================================================
   Boot
   ============================================================ */
const token = readAdminToken();
if (!token) {
  renderGate();
} else {
  buildShell();
  initBackend();
}
</script>
</body>
</html>
