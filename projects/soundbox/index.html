<!DOCTYPE html>
<html lang="en">
<head>
<!--
  SoundBox setup

  1. Create a free Firebase project at console.firebase.google.com, add a Web app,
     and enable Realtime Database (start in test mode).
  2. Paste the Web app config into the firebaseConfig block in the script below
     (look for "EDIT THIS").
  3. For a short classroom event, set database rules open, then revert after:
     {
       "rules": {
         ".read": true,
         ".write": true
       }
     }
     Open write is fine for a trusted in-room event but should not be left public
     long-term. Tighten rules (require auth, validate shape, rate limit) before
     reusing the database for anything else.

  Until the config is filled in, the app runs in demo mode (messages kept in
  memory for this tab) so the full UI is testable before deployment.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundBox</title>

<style>
/* ============================================================
   Tokens
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

:root {
  --color-bg:#f8f9fa; --color-text:#1a1a1a; --color-text-muted:#5b6370;
  --color-accent:#2563eb; --color-accent-light:#dbeafe; --color-accent-medium:#3b82f6;
  --color-accent-hover:#1d4ed8; --color-border:#e5e7eb; --color-card-bg:#ffffff;
  --color-control-bg:#f3f4f6;
  --color-success:#10b981; --color-warning:#f59e0b; --color-error:#ef4444;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-serif:'Source Serif 4','Source Serif Pro',Charter,Georgia,serif;
  --font-mono:'JetBrains Mono','SF Mono',Monaco,Consolas,monospace;
  --feat-sans:"cv11","ss01","cv05"; --feat-mono:"tnum","zero"; --feat-num:"tnum","ss01";
  --text-xs:0.75rem; --text-sm:0.875rem; --text-base:1rem; --text-md:1.125rem;
  --text-lg:1.4rem; --text-xl:1.75rem; --text-2xl:2.1875rem; --text-3xl:2.75rem;
  --text-4xl:3.4375rem; --text-5xl:4.25rem;
  --lh-tight:1.1; --lh-snug:1.25; --lh-body:1.55; --lh-prose:1.7;
  --tracking-tighter:-0.03em; --tracking-tight:-0.015em; --tracking-wide:0.05em; --tracking-wider:0.1em;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --max-width:1400px; --max-width-narrow:640px;
  --spacing-xs:0.5rem; --spacing-sm:1rem; --spacing-md:1.5rem; --spacing-lg:2rem; --spacing-xl:4rem;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05);
  --shadow-accent:0 4px 12px rgba(37,99,235,0.1);
  --shadow-button:0 2px 4px rgba(37,99,235,0.2);
  --radius-sm:0.375rem; --radius-md:0.5rem; --radius-lg:0.75rem;
  --transition-fast:0.15s ease; --transition-normal:0.2s ease;
  --bg-signature:
    radial-gradient(ellipse at 15% 20%, rgba(37,99,235,0.04) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 80%, rgba(16,185,129,0.03) 0%, transparent 45%),
    var(--color-bg);
}
[data-theme="dark"] {
  --color-bg:#111827; --color-text:#f3f4f6; --color-text-muted:#9ca3af;
  --color-accent:#bfdbfe; --color-accent-light:rgba(191,219,254,0.15);
  --color-border:#374151; --color-card-bg:#1f2937; --color-control-bg:#374151;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.4),0 2px 4px -1px rgba(0,0,0,0.3);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.4),0 4px 6px -2px rgba(0,0,0,0.3);
  --bg-signature:
    radial-gradient(ellipse at 15% 20%, rgba(59,130,246,0.15) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 80%, rgba(16,185,129,0.10) 0%, transparent 45%),
    var(--color-bg);
}
html { font-size:18px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
body { font-family:var(--font-sans); font-feature-settings:var(--feat-sans);
  background:var(--bg-signature); color:var(--color-text); line-height:var(--lh-body); text-wrap:pretty; }
.h-page-title { font-family:var(--font-serif); font-size:var(--text-3xl); font-weight:600; font-variation-settings:"opsz" 36; letter-spacing:var(--tracking-tight); line-height:var(--lh-snug); }
.h-card { font-family:var(--font-serif); font-variation-settings:"opsz" 24; font-size:var(--text-xl); font-weight:600; line-height:var(--lh-snug); }
.t-subtitle { font-size:var(--text-md); color:var(--color-text-muted); }
.t-body { font-size:var(--text-base); line-height:var(--lh-body); }
.t-small { font-size:var(--text-sm); color:var(--color-text-muted); }
.t-label { font-size:var(--text-xs); font-family:var(--font-mono); font-feature-settings:var(--feat-mono); font-weight:500; text-transform:uppercase; letter-spacing:var(--tracking-wide); color:var(--color-text-muted); }
.t-mono { font-family:var(--font-mono); font-feature-settings:var(--feat-mono); font-size:var(--text-xs); }
.t-numeric { font-variant-numeric:tabular-nums; font-feature-settings:var(--feat-num); }
a { color:var(--color-accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; transition:opacity var(--transition-fast); }
a:hover { opacity:0.8; }

/* ============================================================
   Reset and base
   ============================================================ */
*, *::before, *::after { box-sizing:border-box; }
body, h1, h2, h3, p, button, input, textarea { margin:0; padding:0; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input, textarea { font:inherit; color:inherit; }

.visually-hidden {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ============================================================
   Layout
   ============================================================ */
.app {
  max-width:var(--max-width-narrow);
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex; flex-direction:column;
  padding:var(--spacing-md) var(--spacing-sm);
  gap:var(--spacing-md);
}

/* Demo mode notice */
.notice {
  display:none;
  padding:var(--spacing-xs) var(--spacing-sm);
  background:var(--color-card-bg);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
}
.notice.is-visible { display:block; }
.notice__dot {
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--color-warning); margin-right:0.5rem; vertical-align:middle;
}

/* ============================================================
   Header
   ============================================================ */
.header {
  display:flex; align-items:flex-start; gap:var(--spacing-sm);
}
.header__brand {
  display:flex; align-items:center; gap:0.75rem; flex:1; min-width:0;
}
.header__brand svg { flex-shrink:0; }
.header__title-block { min-width:0; }
.header__title {
  font-family:var(--font-serif); font-variation-settings:"opsz" 28;
  font-size:var(--text-xl); font-weight:600; line-height:var(--lh-tight);
  letter-spacing:var(--tracking-tight);
}
.header__subtitle {
  font-size:var(--text-sm); color:var(--color-text-muted); margin-top:0.125rem;
}
.header__controls {
  display:flex; align-items:center; gap:var(--spacing-sm); padding-top:0.25rem;
}

/* Live indicator */
.live {
  display:inline-flex; align-items:center; gap:0.5rem;
}
.live__dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--color-success);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity:1; }
  50% { opacity:0.5; }
}
.live__count { font-variant-numeric:tabular-nums; }

/* Theme toggle */
.theme-toggle {
  width:36px; height:36px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  color:var(--color-text);
  background:var(--color-card-bg);
  transition:background var(--transition-fast), color var(--transition-fast),
             border-color var(--transition-fast);
}
.theme-toggle svg {
  transition:transform var(--transition-normal);
}
.theme-toggle:hover {
  background:var(--color-text);
  color:var(--color-card-bg);
  border-color:var(--color-text);
}
.theme-toggle:hover svg { transform:rotate(15deg); }

/* ============================================================
   Join screen
   ============================================================ */
.join {
  flex:1;
  display:flex; align-items:center; justify-content:center;
}
.join.is-hidden { display:none; }
.join__card {
  width:100%;
  background:var(--color-card-bg);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:var(--spacing-lg);
  text-align:center;
}
.join__title { margin-bottom:var(--spacing-md); }
.join__form {
  display:flex; flex-direction:column; gap:var(--spacing-sm);
  max-width:380px; margin:0 auto;
}

/* ============================================================
   Inputs
   ============================================================ */
.input {
  width:100%;
  padding:0.75rem 1rem;
  font:inherit; color:var(--color-text);
  background:var(--color-card-bg);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  transition:border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.input:focus {
  outline:none;
  border-color:var(--color-accent);
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}
.input::placeholder { color:var(--color-text-muted); }

/* ============================================================
   Buttons
   ============================================================ */
.btn-primary {
  padding:0.875rem 1.5rem;
  font-weight:500;
  color:#fff;
  background:var(--color-accent);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-button);
  transition:background var(--transition-fast), box-shadow var(--transition-fast),
             transform var(--transition-fast);
}
.btn-primary:hover {
  background:var(--color-accent-hover);
  box-shadow:0 4px 8px rgba(37,99,235,0.3);
}
.btn-primary:active { transform:scale(0.98); }
.btn-primary:disabled {
  background:var(--color-text-muted);
  color:var(--color-card-bg);
  box-shadow:none;
  cursor:not-allowed;
}

.btn-ghost {
  padding:0.5rem 0.875rem;
  background:transparent;
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  color:var(--color-text);
  font-size:var(--text-sm);
  transition:background var(--transition-fast), border-color var(--transition-fast);
}
.btn-ghost:hover {
  border-color:var(--color-text);
  background:var(--color-control-bg);
}

.btn-link {
  color:var(--color-text-muted);
  font-size:var(--text-sm);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:2px;
  padding:0;
  background:none;
  border:0;
  transition:color var(--transition-fast);
}
.btn-link:hover { color:var(--color-text); }

/* ============================================================
   Room
   ============================================================ */
.room {
  flex:1;
  display:flex; flex-direction:column;
  gap:var(--spacing-sm);
  min-height:0; /* allow flex child to scroll */
}
.room.is-hidden { display:none; }

.messages {
  flex:1;
  overflow-y:auto;
  display:flex; flex-direction:column;
  gap:var(--spacing-xs);
  padding:var(--spacing-xs) 0;
  scroll-behavior:smooth;
}

.messages__empty {
  flex:1;
  display:flex; align-items:center; justify-content:center;
  text-align:center;
  color:var(--color-text-muted);
  font-size:var(--text-sm);
}

/* ============================================================
   Message rows
   ============================================================ */
.msg {
  max-width:80%;
  background:var(--color-card-bg);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  padding:0.625rem 0.875rem;
  display:flex; flex-direction:column; gap:0.25rem;
}
.msg--own {
  align-self:flex-end;
  background:var(--color-accent-light);
  border-color:transparent;
}
.msg--other { align-self:flex-start; }

.msg--grouped { margin-top:-0.25rem; }

.msg__head {
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--spacing-sm);
}
.msg__name {
  font-size:var(--text-xs);
  font-family:var(--font-mono);
  font-feature-settings:var(--feat-mono);
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:var(--tracking-wide);
  /* color set inline per sender */
}
.msg__time {
  font-family:var(--font-mono);
  font-feature-settings:var(--feat-mono);
  font-size:var(--text-xs);
  font-variant-numeric:tabular-nums;
  color:var(--color-text-muted);
  flex-shrink:0;
}
.msg__body {
  font-size:var(--text-base);
  line-height:var(--lh-body);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* ============================================================
   Composer
   ============================================================ */
.composer {
  display:flex; flex-direction:column; gap:var(--spacing-xs);
}
.composer__meta {
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--spacing-sm);
  font-size:var(--text-xs);
  color:var(--color-text-muted);
}
.composer__identity {
  display:inline-flex; align-items:center; gap:0.5rem;
  flex-wrap:wrap;
}
.composer__name {
  font-family:var(--font-mono);
  font-feature-settings:var(--feat-mono);
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:var(--tracking-wide);
}
.composer__count.is-warn { color:var(--color-warning); }
.composer__count.is-error { color:var(--color-error); }

.composer__row {
  display:flex; gap:var(--spacing-xs); align-items:flex-end;
}
.composer__input {
  flex:1;
  resize:none;
  min-height:2.75rem;
  max-height:8rem;
  line-height:var(--lh-body);
  font-family:var(--font-sans);
}

/* ============================================================
   Focus, motion
   ============================================================ */
:focus-visible {
  outline:2px solid var(--color-accent);
  outline-offset:2px;
}
.input:focus-visible {
  outline:none; /* halo replaces outline on inputs */
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
    scroll-behavior:auto !important;
  }
  .live__dot { animation:none; opacity:1; }
}

/* ============================================================
   Small screens
   ============================================================ */
@media (max-width: 480px) {
  .app { padding:var(--spacing-sm) var(--spacing-xs); gap:var(--spacing-sm); }
  .header__title { font-size:var(--text-md); }
  .header__subtitle { font-size:var(--text-xs); }
  .msg { max-width:90%; }
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- Demo mode notice -->
  <div class="notice" id="notice" role="status">
    <span class="notice__dot" aria-hidden="true"></span>
    <span class="t-small" id="notice-text">Demo mode, messages are not shared. Add your Firebase config to go live.</span>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header__brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#2563eb"></rect>
        <path d="M4,16 Q8,8 12,16 T20,16 T28,16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>
        <path d="M4,16 Q10,22 16,16 T28,16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"></path>
      </svg>
      <div class="header__title-block">
        <h1 class="header__title">SoundBox</h1>
        <p class="header__subtitle">Talk during the session.</p>
      </div>
    </div>
    <div class="header__controls">
      <span class="live" aria-label="Live status">
        <span class="live__dot" aria-hidden="true"></span>
        <span class="t-label">live</span>
        <span class="t-label live__count" id="live-count" aria-hidden="true"></span>
      </span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
        <!-- icon injected by JS -->
      </button>
    </div>
  </header>

  <!-- Join screen -->
  <section class="join" id="join" aria-labelledby="join-title">
    <div class="join__card">
      <h2 class="h-card join__title" id="join-title">What should we call you?</h2>
      <form class="join__form" id="join-form" novalidate>
        <label class="visually-hidden" for="name-input">Your name</label>
        <input
          class="input"
          id="name-input"
          name="name"
          type="text"
          autocomplete="nickname"
          maxlength="40"
          required
          placeholder="Your name"
        >
        <button class="btn-primary" type="submit">Join</button>
      </form>
    </div>
  </section>

  <!-- Room -->
  <section class="room is-hidden" id="room" aria-label="Chat room">

    <div class="messages" id="messages" aria-live="polite" aria-relevant="additions" aria-atomic="false">
      <div class="messages__empty" id="messages-empty">
        No messages yet. Say hello.
      </div>
    </div>

    <div class="composer">
      <div class="composer__meta">
        <span class="composer__identity">
          <span class="t-small">You are</span>
          <span class="composer__name" id="self-name"></span>
          <button class="btn-link" type="button" id="change-name">change name</button>
        </span>
        <span class="composer__count" id="char-count" aria-live="polite"></span>
      </div>
      <form class="composer__row" id="send-form" novalidate>
        <label class="visually-hidden" for="msg-input">Message</label>
        <textarea
          class="input composer__input"
          id="msg-input"
          name="msg"
          rows="1"
          maxlength="500"
          placeholder="Say something."
        ></textarea>
        <button class="btn-primary" type="submit" aria-label="Send message">Send</button>
      </form>
    </div>

  </section>

</div>

<script type="module">
/* ============================================================
   Config
   EDIT THIS: paste your Firebase config (Project settings > Your apps > Web)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAoN6kYjrq4b3aatmnd8pgxgg5wV-ekScE",
  authDomain: "soundbox-9.firebaseapp.com",
  databaseURL: "https://soundbox-9-default-rtdb.firebaseio.com",
  projectId: "soundbox-9",
  appId: "1:1069332070599:web:4959225a4eb3d33e6ebee2"
};
const ROOM_PATH = "soundbox/messages";
/* ============================================================ */

const STORAGE_NAME  = "soundbox.name";
const STORAGE_THEME = "soundbox.theme";

const PALETTE = [
  "var(--color-accent)",
  "var(--color-success)",
  "var(--color-warning)",
  "var(--color-error)",
  "var(--color-accent-medium)"
];

const GROUP_WINDOW_MS    = 2 * 60 * 1000;   // 2 minutes for name grouping
const PARTICIPANT_WIN_MS = 10 * 60 * 1000;  // 10 minutes for live count
const SCROLL_THRESHOLD   = 60;              // px from bottom to count as "near"

/* ============================================================
   DOM
   ============================================================ */
const $ = (id) => document.getElementById(id);
const root         = document.documentElement;
const noticeEl     = $("notice");
const noticeText   = $("notice-text");
const joinEl       = $("join");
const joinForm     = $("join-form");
const nameInput    = $("name-input");
const roomEl       = $("room");
const messagesEl   = $("messages");
const emptyEl      = $("messages-empty");
const selfNameEl   = $("self-name");
const changeNameEl = $("change-name");
const sendForm     = $("send-form");
const msgInput     = $("msg-input");
const charCountEl  = $("char-count");
const liveCountEl  = $("live-count");
const themeBtn     = $("theme-toggle");

/* ============================================================
   Theme
   ============================================================ */
const SUN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
const MOON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function applyTheme(theme) {
  root.setAttribute("data-theme", theme);
  // Show the icon for the mode you would switch TO
  themeBtn.innerHTML = theme === "dark" ? SUN_SVG : MOON_SVG;
  themeBtn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
}

function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem(STORAGE_THEME); } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(theme);
}

themeBtn.addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(STORAGE_THEME, next); } catch (e) {}
});

initTheme();

/* ============================================================
   Identity
   ============================================================ */
let myName = null;

function loadName() {
  try { return localStorage.getItem(STORAGE_NAME); } catch (e) { return null; }
}
function saveName(name) {
  try { localStorage.setItem(STORAGE_NAME, name); } catch (e) {}
}

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) {
    h = (h * 31 + name.charCodeAt(i)) >>> 0;
  }
  return PALETTE[h % PALETTE.length];
}

function enterRoom(name) {
  myName = name;
  selfNameEl.textContent = name;
  selfNameEl.style.color = colorFor(name);
  joinEl.classList.add("is-hidden");
  roomEl.classList.remove("is-hidden");
  // Defer focus so layout has settled
  requestAnimationFrame(() => msgInput.focus());
}

function showJoin(prefill) {
  roomEl.classList.add("is-hidden");
  joinEl.classList.remove("is-hidden");
  nameInput.value = prefill || "";
  requestAnimationFrame(() => {
    nameInput.focus();
    nameInput.select();
  });
}

joinForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  if (!name) return;
  saveName(name);
  enterRoom(name);
});

changeNameEl.addEventListener("click", () => {
  showJoin(myName);
});

/* ============================================================
   Backend: Firebase or demo fallback
   ============================================================ */
let backend = null;

function configLooksReal(cfg) {
  return cfg
    && cfg.databaseURL
    && cfg.apiKey
    && cfg.apiKey !== "PASTE"
    && cfg.databaseURL !== "PASTE";
}

function showDemoNotice(reason) {
  noticeEl.classList.add("is-visible");
  if (reason) noticeText.textContent = reason;
}

async function initBackend() {
  if (!configLooksReal(firebaseConfig)) {
    showDemoNotice("Demo mode, messages are not shared. Add your Firebase config to go live.");
    return makeDemoBackend();
  }
  try {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const dbMod  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = appMod.initializeApp(firebaseConfig);
    const db  = dbMod.getDatabase(app);
    const messagesRef = dbMod.ref(db, ROOM_PATH);
    const recent = dbMod.query(messagesRef, dbMod.limitToLast(200));

    return {
      kind: "firebase",
      send(name, text) {
        return dbMod.push(messagesRef, { name, text, ts: dbMod.serverTimestamp() });
      },
      listen(onMessage) {
        dbMod.onChildAdded(recent, (snap) => {
          const v = snap.val();
          if (!v) return;
          onMessage({
            name: typeof v.name === "string" ? v.name : "",
            text: typeof v.text === "string" ? v.text : "",
            ts:   typeof v.ts === "number" ? v.ts : Date.now()
          });
        });
      }
    };
  } catch (err) {
    console.warn("Firebase init failed, falling back to demo mode:", err);
    showDemoNotice("Demo mode, the live backend could not be reached. Messages are local to this tab.");
    return makeDemoBackend();
  }
}

function makeDemoBackend() {
  const listeners = [];
  return {
    kind: "demo",
    send(name, text) {
      const evt = { name, text, ts: Date.now() };
      // Async to mimic network and to let render order match
      queueMicrotask(() => listeners.forEach((fn) => fn(evt)));
      return Promise.resolve();
    },
    listen(onMessage) {
      listeners.push(onMessage);
    }
  };
}

/* ============================================================
   Rendering
   ============================================================ */
let lastMessage = null;          // { name, ts }
const seenSenders = new Map();   // name -> last ts seen

function isNearBottom() {
  const gap = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
  return gap < SCROLL_THRESHOLD;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function formatTime(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return hh + ":" + mm;
}

function renderMessage(msg) {
  // Remove the empty state on first render
  if (emptyEl && emptyEl.isConnected) emptyEl.remove();

  const wasNearBottom = isNearBottom();

  const isOwn = msg.name === myName;
  const grouped =
    lastMessage &&
    lastMessage.name === msg.name &&
    (msg.ts - lastMessage.ts) < GROUP_WINDOW_MS;

  const row = document.createElement("article");
  row.className = "msg " + (isOwn ? "msg--own" : "msg--other") + (grouped ? " msg--grouped" : "");

  const head = document.createElement("div");
  head.className = "msg__head";

  if (!grouped) {
    const nameEl = document.createElement("span");
    nameEl.className = "msg__name";
    nameEl.style.color = colorFor(msg.name);
    nameEl.textContent = msg.name; // textContent: never innerHTML for user data
    head.appendChild(nameEl);
  } else {
    // Spacer to keep timestamp right-aligned in grouped rows
    const spacer = document.createElement("span");
    head.appendChild(spacer);
  }

  const timeEl = document.createElement("time");
  timeEl.className = "msg__time";
  timeEl.dateTime = new Date(msg.ts).toISOString();
  timeEl.textContent = formatTime(msg.ts);
  head.appendChild(timeEl);

  const body = document.createElement("div");
  body.className = "msg__body t-body";
  body.textContent = msg.text; // textContent: safe against any HTML/script

  row.appendChild(head);
  row.appendChild(body);

  messagesEl.appendChild(row);
  lastMessage = { name: msg.name, ts: msg.ts };

  // Track recent senders for the live count
  seenSenders.set(msg.name, Math.max(seenSenders.get(msg.name) || 0, msg.ts));
  updateLiveCount();

  if (wasNearBottom) scrollToBottom();
}

function updateLiveCount() {
  const cutoff = Date.now() - PARTICIPANT_WIN_MS;
  let count = 0;
  for (const [name, ts] of seenSenders) {
    if (ts >= cutoff) count++;
    else seenSenders.delete(name);
  }
  liveCountEl.textContent = count > 0 ? String(count) : "";
}
setInterval(updateLiveCount, 30000);

/* ============================================================
   Composer
   ============================================================ */
function autosizeComposer() {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 128) + "px";
}

function updateCharCount() {
  const remaining = 500 - msgInput.value.length;
  if (remaining > 50) {
    charCountEl.textContent = "";
    charCountEl.classList.remove("is-warn", "is-error");
    return;
  }
  charCountEl.textContent = String(remaining);
  charCountEl.classList.toggle("is-warn", remaining <= 50 && remaining > 10);
  charCountEl.classList.toggle("is-error", remaining <= 10);
}

msgInput.addEventListener("input", () => {
  autosizeComposer();
  updateCharCount();
});

msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendForm.requestSubmit();
  }
});

sendForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!backend || !myName) return;
  const text = msgInput.value.trim();
  if (!text) return;
  const capped = text.slice(0, 500);
  msgInput.value = "";
  autosizeComposer();
  updateCharCount();
  try {
    await backend.send(myName, capped);
  } catch (err) {
    console.error("Send failed:", err);
    // Restore text so the student does not lose what they typed
    msgInput.value = capped;
    autosizeComposer();
    updateCharCount();
  }
});

/* ============================================================
   Boot
   ============================================================ */
(async function boot() {
  const stored = loadName();
  if (stored) enterRoom(stored);
  else showJoin();

  backend = await initBackend();
  backend.listen(renderMessage);
})();
</script>
