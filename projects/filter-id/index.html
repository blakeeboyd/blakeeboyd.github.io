<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Train your ears to identify filter types, frequencies, and gain by listening to audio processed through EQ filters.">
    <title>Filter Identification - Blake Boyd</title>
    <!-- SEO -->
    <link rel="canonical" href="https://blakeeboyd.github.io/projects/filter-id/">
    <!-- Open Graph -->
    <meta property="og:title" content="Filter Identification - Blake Boyd">
    <meta property="og:description" content="Train your ears to identify filter types, frequencies, and gain by listening to audio processed through EQ filters.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://blakeeboyd.github.io/projects/filter-id/">
    <meta property="og:site_name" content="Blake Boyd">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Filter Identification - Blake Boyd">
    <meta name="twitter:description" content="Train your ears to identify filter types, frequencies, and gain by listening to audio processed through EQ filters.">
    <meta name="theme-color" content="#2563eb">
    <meta name="author" content="Blake E. Boyd">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/components-audio.css">
    <link rel="stylesheet" href="../../css/projects/filterIdentification.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="../../js/theme.js"></script>
    <script src="../../js/nav-component.js" defer></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="container wide">
        <site-nav base="../../"></site-nav>

        <main id="main-content">
            <div class="page-header">
                <h1 class="page-title">Filter Identification</h1>
                <p class="page-subtitle">Train your ears to recognize filter types and frequencies. <a href="guide.html" style="color: var(--color-accent); font-weight: 500;">Guide &rarr;</a></p>
            </div>

            <div class="fid-app">
                <!-- Toolbar -->
                <div class="fid-toolbar">
                    <div class="fid-toolbar-row">
                        <div class="fid-toolbar-group">
                            <span class="fid-toolbar-label">Mode</span>
                            <button class="info-trigger" aria-label="Mode info">i<span class="info-tooltip" role="tooltip"><strong>Practice:</strong> Direct control of all filter parameters.<br><strong>Teaching:</strong> Listen to a sequence of unfiltered then filtered audio.<br><strong>Quiz:</strong> Identify the hidden filter by ear.</span></button>
                            <div class="fid-toolbar-buttons">
                                <button type="button" class="fid-toolbar-btn active" data-mode="practice">Practice</button>
                                <button type="button" class="fid-toolbar-btn" data-mode="teaching">Teaching</button>
                                <button type="button" class="fid-toolbar-btn" data-mode="quiz">Quiz</button>
                            </div>
                        </div>
                        <button type="button" class="fid-demo-btn" id="demo-btn">Demo</button>
                    </div>
                    <div class="fid-toolbar-row fid-source-row">
                        <div class="fid-toolbar-group">
                            <span class="fid-toolbar-label">Source</span>
                            <button class="info-trigger" aria-label="Source info">i<span class="info-tooltip" role="tooltip">Audio source for the filter.<br><strong>Pink Noise</strong> has equal energy per octave, ideal for hearing filter shapes.<br><strong>User Audio</strong> lets you upload a file.<br><strong>Multi-track</strong> loads built-in stems with a mixer.<br><strong>Sawtooth</strong> is a synthesized tone with rich harmonic content.</span></button>
                            <div class="fid-toolbar-buttons">
                                <button type="button" class="fid-toolbar-btn active" data-source="0">Mute</button>
                                <button type="button" class="fid-toolbar-btn" data-source="1">Pink Noise</button>
                                <button type="button" class="fid-toolbar-btn" data-source="2">User Audio</button>
                                <button type="button" class="fid-toolbar-btn" data-source="3">Multi-track</button>
                                <button type="button" class="fid-toolbar-btn" data-source="4">Sawtooth</button>
                            </div>
                        </div>
                        <div class="fid-toolbar-group fid-toolbar-gain">
                            <span class="fid-toolbar-label">Gain</span>
                            <input type="range" class="fid-toolbar-slider" id="gain-slider" min="-70" max="6" value="-24" step="1">
                            <span class="fid-toolbar-value" id="gain-display">-24 dB</span>
                        </div>
                    </div>
                    <!-- User audio upload + playback (inside toolbar, after source row) -->
                    <div class="upload-area fid-source-extras hidden" id="upload-area">
                        <input type="file" id="audio-file-input" accept="audio/*" hidden>
                        <label for="audio-file-input" class="upload-label fid-upload-compact">
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Drop audio file or click to upload</span>
                        </label>
                    </div>
                    <div class="playback-controls fid-source-extras hidden" id="playback-controls">
                        <button type="button" class="play-button fid-play-sm" id="play-button" aria-label="Play">
                            <svg class="icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5,3 19,12 5,21"></polygon>
                            </svg>
                            <svg class="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                        </button>
                        <div class="progress-container">
                            <div class="progress-bar" id="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                            <span class="time-display" id="time-display">0:00 / 0:00</span>
                        </div>
                    </div>

                    <!-- Mode-specific controls (inside toolbar) -->
                    <div class="fid-teaching-controls hidden" id="teaching-controls">
                        <label class="fid-dropdown-label">Source
                        <select class="fid-quiz-source" id="teaching-source-select">
                            <option value="1">Pink Noise</option>
                            <option value="2">User Audio</option>
                            <option value="3">Multi-track</option>
                            <option value="4">Sawtooth</option>
                        </select>
                        </label>
                        <button type="button" class="action-button action-button-primary" id="listen-btn">Listen</button>
                        <button type="button" class="fid-toolbar-btn" id="loop-btn">Loop</button>
                        <div class="fid-duration-controls">
                            <label class="fid-duration-label">unfiltered <input type="number" class="fid-duration-input" id="teaching-bypass-dur" min="1" max="30" value="4">s</label>
                            <label class="fid-duration-label">filtered <input type="number" class="fid-duration-input" id="teaching-filter-dur" min="1" max="30" value="5">s</label>
                        </div>
                    </div>
                    <div class="fid-quiz-controls hidden" id="quiz-controls">
                        <div class="fid-quiz-row">
                            <label class="fid-dropdown-label">Source
                            <select class="fid-quiz-source" id="quiz-source-select">
                                <option value="1">Pink Noise</option>
                                <option value="2">User Audio</option>
                                <option value="3">Multi-track</option>
                                <option value="4">Sawtooth</option>
                            </select>
                            </label>
                            <label class="fid-dropdown-label">Drill
                            <select class="fid-quiz-source" id="quiz-drill-select">
                                <option value="all">All Parameters</option>
                                <option value="filterTypes">Filter Types</option>
                                <option value="frequencies">Frequencies</option>
                            </select>
                            </label>
                            <label class="fid-dropdown-label hidden" id="quiz-drill-freq-label">At
                            <select class="fid-quiz-source" id="quiz-drill-freq">
                                <option value="250">250 Hz</option>
                                <option value="500">500 Hz</option>
                                <option value="1000" selected>1 kHz</option>
                                <option value="2000">2 kHz</option>
                                <option value="4000">4 kHz</option>
                                <option value="8000">8 kHz</option>
                                <option value="16000">16 kHz</option>
                            </select>
                            </label>
                            <label class="fid-dropdown-label hidden" id="quiz-drill-type-label">Filter
                            <select class="fid-quiz-source" id="quiz-drill-type">
                                <option value="highpass">High-Pass</option>
                                <option value="lowpass">Low-Pass</option>
                                <option value="bandpass">Bandpass</option>
                                <option value="highshelf">High Shelf</option>
                                <option value="lowshelf">Low Shelf</option>
                                <option value="peaking" selected>Peaking</option>
                            </select>
                            </label>
                            <label class="fid-dropdown-label" id="quiz-gain-dir-label">Gain
                            <select class="fid-quiz-source" id="quiz-gain-dir">
                                <option value="both">Both</option>
                                <option value="boost" selected>Boost only</option>
                                <option value="cut">Cut only</option>
                            </select>
                            </label>
                        </div>
                        <div class="fid-quiz-row">
                            <div class="fid-duration-controls">
                                <label class="fid-duration-label">unfiltered <input type="number" class="fid-duration-input" id="quiz-bypass-dur" min="1" max="30" value="4">s</label>
                                <label class="fid-duration-label">filtered <input type="number" class="fid-duration-input" id="quiz-filter-dur" min="1" max="30" value="5">s</label>
                            </div>
                            <div class="fid-score">
                                <span class="fid-score-label">Score:</span>
                                <span id="quiz-score">0/0</span>
                            </div>
                            <div class="fid-score">
                                <span class="fid-score-label">Streak:</span>
                                <span id="quiz-streak">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Test Indicator (teaching + quiz modes) -->
                <div class="fid-test-indicator hidden" id="test-indicator">
                    <span id="test-phase"></span>
                    <span id="test-countdown"></span>
                </div>

                <!-- Filter Display + Controls -->
                <div class="card fid-selection-card">
                    <!-- Filter On/Bypass + Visualization -->
                    <div class="fid-param-group fid-filter-header" id="filter-header">
                        <div class="fid-filter-header-row">
                            <h3 class="fid-param-label">Filter</h3>
                            <div class="fid-filter-toggles">
                                <button type="button" class="fid-toolbar-btn active" id="filter-on-btn">On</button>
                            </div>
                            <span class="fid-param-label">Spectrum</span>
                            <div class="fid-filter-toggles">
                                <button type="button" class="fid-toolbar-btn" id="spectrum-btn">Off</button>
                            </div>
                        </div>
                        <div class="fid-canvas-container">
                            <canvas id="filter-canvas" aria-label="Filter frequency response curve"></canvas>
                        </div>
                    </div>

                    <!-- Quiz comparison view (hidden until answer submitted) -->
                    <div class="fid-param-group fid-quiz-compare hidden" id="quiz-compare">
                        <div class="fid-compare-row">
                            <div class="fid-compare-panel">
                                <h4 class="fid-compare-label" id="compare-user-label">Your Answer</h4>
                                <div class="fid-canvas-container fid-compare-canvas">
                                    <canvas id="compare-user-canvas"></canvas>
                                </div>
                            </div>
                            <div class="fid-compare-panel">
                                <h4 class="fid-compare-label" id="compare-correct-label">Correct Answer</h4>
                                <div class="fid-canvas-container fid-compare-canvas">
                                    <canvas id="compare-correct-canvas"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Filter Type -->
                    <div class="fid-param-group">
                        <h3 class="fid-param-label">Type</h3>
                        <button class="info-trigger" aria-label="Filter type info">i<span class="info-tooltip" role="tooltip">The shape of the filter.<br><strong>High/Low-Pass</strong> remove frequencies above/below the cutoff.<br><strong>Shelving</strong> filters boost or cut above/below a frequency.<br><strong>Peaking</strong> boosts or cuts a band around the center frequency.<br><strong>Bandpass</strong> lets only a band through.</span></button>
                        <div class="fid-button-group" id="type-buttons">
                            <button type="button" class="fid-toggle active" data-type="highpass">High-Pass</button>
                            <button type="button" class="fid-toggle" data-type="lowpass">Low-Pass</button>
                            <button type="button" class="fid-toggle" data-type="bandpass">Bandpass</button>
                            <button type="button" class="fid-toggle" data-type="highshelf">High Shelf</button>
                            <button type="button" class="fid-toggle" data-type="lowshelf">Low Shelf</button>
                            <button type="button" class="fid-toggle" data-type="peaking">Peaking</button>
                        </div>
                    </div>

                    <!-- Frequency -->
                    <div class="fid-param-group">
                        <h3 class="fid-param-label">Freq</h3>
                        <button class="info-trigger" aria-label="Frequency info">i<span class="info-tooltip" role="tooltip">Center or cutoff frequency of the filter. The vowel hints show what a narrow boost at each frequency sounds like in pink noise.</span></button>
                        <div class="fid-button-group" id="freq-buttons">
                            <button type="button" class="fid-toggle" data-freq="250">
                                <span class="fid-toggle-main">250 Hz</span>
                                <span class="fid-toggle-hint">U "food"</span>
                            </button>
                            <button type="button" class="fid-toggle active" data-freq="500">
                                <span class="fid-toggle-main">500 Hz</span>
                                <span class="fid-toggle-hint">O "no"</span>
                            </button>
                            <button type="button" class="fid-toggle" data-freq="1000">
                                <span class="fid-toggle-main">1 kHz</span>
                                <span class="fid-toggle-hint">AH "aha"</span>
                            </button>
                            <button type="button" class="fid-toggle" data-freq="2000">
                                <span class="fid-toggle-main">2 kHz</span>
                                <span class="fid-toggle-hint">EH "let"</span>
                            </button>
                            <button type="button" class="fid-toggle" data-freq="4000">
                                <span class="fid-toggle-main">4 kHz</span>
                                <span class="fid-toggle-hint">EE "bee"</span>
                            </button>
                            <button type="button" class="fid-toggle" data-freq="8000">
                                <span class="fid-toggle-main">8 kHz</span>
                                <span class="fid-toggle-hint">S "sam"</span>
                            </button>
                            <button type="button" class="fid-toggle" data-freq="16000">
                                <span class="fid-toggle-main">16 kHz</span>
                                <span class="fid-toggle-hint">TS "cats"</span>
                            </button>
                        </div>
                    </div>

                    <!-- Gain (hidden for HP/LP) -->
                    <div class="fid-param-group hidden" id="gain-group">
                        <h3 class="fid-param-label">Gain</h3>
                        <button class="info-trigger" aria-label="Gain info">i<span class="info-tooltip" role="tooltip">How much the filter boosts or cuts, in decibels.</span></button>
                        <div class="fid-button-group" id="gain-buttons">
                            <button type="button" class="fid-toggle" data-gain="-12">-12 dB</button>
                            <button type="button" class="fid-toggle" data-gain="-6">-6 dB</button>
                            <button type="button" class="fid-toggle" data-gain="-3">-3 dB</button>
                            <button type="button" class="fid-toggle active" data-gain="3">+3 dB</button>
                            <button type="button" class="fid-toggle" data-gain="6">+6 dB</button>
                            <button type="button" class="fid-toggle" data-gain="12">+12 dB</button>
                        </div>
                    </div>

                    <!-- Filter Settings -->
                    <div class="fid-param-group fid-settings-group" id="filter-settings">
                        <h3 class="fid-param-label">Shape</h3>
                        <button class="info-trigger" aria-label="Shape info">i<span class="info-tooltip" role="tooltip">For high/low-pass: steepness of the slope (12, 24, or 48 dB/octave).<br>For peaking: bandwidth in octaves.<br>For shelf: slope parameter S.</span></button>
                        <div class="fid-settings-content">
                            <div id="settings-slope">
                                <div class="fid-button-group" id="slope-buttons">
                                    <button type="button" class="fid-toggle active" data-slope="12">12 dB/oct</button>
                                    <button type="button" class="fid-toggle" data-slope="24">24 dB/oct</button>
                                    <button type="button" class="fid-toggle" data-slope="48">48 dB/oct</button>
                                </div>
                            </div>
                            <div id="settings-bandwidth" class="hidden">
                                <div class="fid-button-group" id="bw-buttons">
                                    <button type="button" class="fid-toggle" data-bw="0.5">&frac12; oct</button>
                                    <button type="button" class="fid-toggle" data-bw="1">1 oct</button>
                                    <button type="button" class="fid-toggle active" data-bw="2">2 oct</button>
                                    <button type="button" class="fid-toggle" data-bw="3">3 oct</button>
                                </div>
                            </div>
                            <div id="settings-shelf-q" class="hidden">
                                <div class="fid-button-group" id="shelf-q-buttons">
                                    <button type="button" class="fid-toggle" data-q="0.5">Gentle</button>
                                    <button type="button" class="fid-toggle active" data-q="1">Standard</button>
                                    <button type="button" class="fid-toggle" data-q="2">Steep</button>
                                    <button type="button" class="fid-toggle" data-q="4">Resonant</button>
                                </div>
                            </div>
                            <span class="fid-q-readout" id="q-readout"></span>
                        </div>
                    </div>

                    <!-- Quiz Answer Submission -->
                    <div class="fid-quiz-submit hidden" id="quiz-submit">
                        <button type="button" class="action-button action-button-primary" id="submit-answer-btn" disabled>Submit Answer</button>
                        <button type="button" class="action-button" id="play-again-btn" disabled>Play Again</button>
                    </div>

                    <!-- Quiz Result -->
                    <div class="fid-result hidden" id="quiz-result"></div>

                    <!-- Multi-track controls (mixer + stereo viz) -->
                    <div class="fid-multitrack-controls hidden" id="multitrack-controls">
                        <div class="fid-track-loading hidden" id="track-loading">Loading tracks...</div>
                        <div class="fid-mixer" id="track-buttons"></div>
                        <div class="fid-stereo-viz-container">
                            <canvas id="stereo-viz-canvas" aria-label="Stereo waveform display"></canvas>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <footer>
            <p>&copy; <span class="footer-year"></span> Blake Boyd</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
